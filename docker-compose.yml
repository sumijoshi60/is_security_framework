version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: isms-postgres
    environment:
      POSTGRES_USER: isms_user
      POSTGRES_PASSWORD: isms_pass
      POSTGRES_DB: isms_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U isms_user -d isms_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
